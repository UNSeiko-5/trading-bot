<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Sous-titres FR : réglages</title>
<style>
  body{font:15px/1.4 system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem;color:#1b1b1b}
  label{display:block;margin:1rem 0 .25rem;font-weight:600}
  input,select{width:100%;padding:.45rem;font:inherit;box-sizing:border-box}
  small{color:#555}
  button{margin-top:1.25rem;padding:.55rem 1.2rem;font:inherit}
  #ok{margin-left:.75rem;color:#1a7f37}
</style>
<h1>Sous-titres FR en direct</h1>
<p><small>Les clés restent dans le stockage local de ce navigateur et ne partent que vers le fournisseur concerné.</small></p>

<label for="deepgramKey">Clé API Deepgram (reconnaissance vocale)</label>
<input id="deepgramKey" type="password" autocomplete="off">

<label for="sourceLang">Langue parlée (code Deepgram : en, es, de, ja…)</label>
<input id="sourceLang" type="text" value="en">

<label for="translator">Traduction</label>
<select id="translator">
  <option value="deepl">DeepL (plus rapide, recommandé)</option>
  <option value="google">Google Cloud Translation</option>
  <option value="none">Aucune (affiche le texte source, pour tester)</option>
</select>

<label for="translatorKey">Clé API de traduction</label>
<input id="translatorKey" type="password" autocomplete="off">

<label for="waitK">Stabilité : <span id="waitKv"></span> mot(s) de marge</label>
<input id="waitK" type="range" min="0" max="6" step="1">
<small>0 = le plus instantané (le texte se corrige souvent) · 6 = très stable (plus lent). Réglage conseillé : 2.</small>

<label for="fontScale">Taille des sous-titres : <span id="fontScaleV"></span></label>
<input id="fontScale" type="range" min="0.6" max="2" step="0.1">

<button id="save">Enregistrer</button><span id="ok"></span>
<script src="options.js"></script>
