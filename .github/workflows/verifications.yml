name: Tests et backtest

# Se lance à chaque envoi de code sur GitHub, et à la demande depuis l'onglet Actions.
# N'utilise aucune clé : ne passe jamais d'ordre.
on:
  push:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des bibliothèques (versions figées)
        run: pip install -r requirements.txt

      - name: Tests automatiques
        run: python -m pytest

      - name: Backtest sur tout l'historique de SPY
        run: python backtest.py
