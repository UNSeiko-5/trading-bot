name: Tests et backtest

# Se lance à chaque envoi de code sur GitHub, et à la demande depuis l'onglet Actions.
# N'utilise aucune clé : ne passe jamais d'ordre.
on:
  push:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des bibliothèques (versions figées)
        run: pip install -r requirements.txt

      - name: Tests automatiques
        run: python -m pytest

      - name: Tests de la page de suivi (JavaScript, sans Internet)
        run: cd suivi && node --test tests/*.test.js

      - name: Backtest sur tout l'historique de SPY
        run: python backtest.py

      - name: Test anti-chance (robustesse de la stratégie)
        run: python robustesse.py

      - name: Contrôle qualité des données v2 (10 actifs)
        run: python -m robot.donnees

      - name: Signaux de tendance v2 du jour
        run: python -m robot.signaux

      - name: Répartition v2 visée aujourd'hui
        run: python -m robot.portefeuille

      - name: Régimes de marché du jour (EXP-009, pour information)
        run: python -m robot.regimes

      - name: Krachs simulés (stress test de la v3, pour information)
        run: python krachs_simules.py

      - name: Tableau de bord (graphiques, Monte Carlo, cerveau)
        run: python tableau_de_bord.py

      - name: Envoi du tableau de bord (à télécharger en bas de la page du lancement)
        uses: actions/upload-artifact@v4
        with:
          name: tableau-de-bord
          path: tableau/tableau_de_bord.html
          retention-days: 30

      - name: Backtest v2 (EXP-002, critères de performance)
        run: python backtest_v2.py

      - name: Test anti-chance v2 (EXP-002, critères R1 à R5)
        run: python robustesse_v2.py

      - name: Expérience EXP-003 (v2 + cassures, critères M, P et R)
        run: python experience_003.py

      - name: Expérience EXP-004 (v2 + retour à la moyenne, critères M, P et R)
        run: python experience_004.py

      - name: Expérience EXP-005 (v2 + budget de risque, critères M, P et R)
        run: python experience_005.py

      - name: Expérience EXP-006 (budget de risque + zone tampon, critères M, P et R)
        run: python experience_006.py

      - name: Expérience EXP-008 (v3 + cash rémunéré, critères M, P et R)
        run: python experience_008.py

      - name: Expérience EXP-007 (croisement H1 filtré weekly, critères M, P et R)
        # Les clés Alpaca servent seulement à LIRE l'historique des bougies d'une heure (aucun ordre).
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python experience_007.py

      - name: Expérience EXP-009 (v3 + régimes de marché de la vidéo, critères M, P et R)
        run: python experience_009.py

      - name: Expérience EXP-010 (v3 offensive, agitation visée 17 %, limite -35 %)
        run: python experience_010.py

      - name: Expérience EXP-011 (v3 sur 21 marchés)
        run: python experience_011.py

      - name: Expérience EXP-012 (v3 offensive, plafond 40 % par actif)
        run: python experience_012.py

      - name: Expérience EXP-013 (double momentum d'Antonacci, limite -35 %)
        run: python experience_013.py
