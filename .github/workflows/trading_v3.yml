name: Robot v3 (argent fictif)

on:
  schedule:
    # 22h40 UTC du lundi au vendredi = après la clôture de New York toute l'année.
    # Les ordres sur les ETF partent à l'ouverture suivante, la crypto tout de suite.
    - cron: '40 22 * * 1-5'
  workflow_dispatch:

# Jamais deux robots en même temps sur le compte (évite les ordres en double)
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  robot-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des bibliothèques (versions figées)
        run: pip install -r requirements.txt

      - name: Vérifications automatiques (si un test échoue, le robot ne tourne pas)
        run: python -m pytest

      - name: Lancement du robot v3
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROBOT_V3_DEPART: ${{ vars.ROBOT_V3_DEPART }}
        run: python robot_v3.py

      - name: Alerte Telegram si une étape a échoué
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ Le robot v3 n'a pas tourné correctement ce soir. Détails : onglet Actions du dépôt trading-bot."
