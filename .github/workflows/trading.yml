name: Robot v1 (arrêté, remplacé par la v3)

# Remplacé par le robot v3 (trading_v3.yml) sur le même compte fictif : plus de lancement automatique.
# Reste lançable à la main depuis l'onglet Actions.
on:
  workflow_dispatch:

# Jamais deux robots en même temps (évite les ordres en double)
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des bibliothèques (versions figées)
        run: pip install -r requirements.txt

      - name: Vérifications automatiques (si un test échoue, le robot ne tourne pas)
        run: python -m pytest

      - name: Lancement du robot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Alerte Telegram si une étape a échoué
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ Le robot n'a pas tourné correctement ce soir. Détails : onglet Actions du dépôt trading-bot."
